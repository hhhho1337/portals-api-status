<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12131a">
  <meta name="description" content="Portals Check API profile connection status">
  <title>Portals Check — API profile</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:#141414; color:#fff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:#141414; }
    main { width:min(100%, 380px); display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; }
    dotlottie-wc { display:block; width:min(180px, 48vw); height:min(180px, 48vw); margin-bottom:12px; pointer-events:none; }
    .plate { width:100%; padding:20px 22px; border:1px solid #2e2e2e; border-radius:24px; background:#1f1f1f; display:flex; flex-direction:column; align-items:center; gap:10px; }
    h1 { margin:0; color:#fff; font-size:20px; font-weight:700; line-height:1.3; }
    .message { margin:0; color:#8b96a3; font-size:14px; line-height:1.5; }
    .message strong { color:#c4ced6; font-weight:600; }
    .connect { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-width:180px; padding:14px 40px; border:0; border-radius:999px; background:#229ed9; color:#fff; text-decoration:none; font-size:15px; font-weight:700; letter-spacing:-.2px; transition:transform .15s ease, background-color .15s ease; }
    .connect:hover { transform:translateY(-1px); background:#2aa8e6; }
    .connect:active { transform:translateY(0) scale(.98); }
    .connect:focus-visible { outline:3px solid #c4ced6; outline-offset:4px; }
    .connect svg { width:18px; height:18px; fill:#fff; flex:none; }
  </style>
  <script type="module" src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.4.0/dist/dotlottie-wc.js"></script>
</head>
<body>
  <main>
    <dotlottie-wc src="tgs/pepe.tgs" autoplay loop aria-label="Animated Pepe sticker"></dotlottie-wc>
    <section class="plate" aria-labelledby="status-title">
      <h1 id="status-title">Oops...</h1>
      <p class="message">You are not logined for Portals APIs.<br>Please, connect your profile on API and try again.</p>
      <a class="connect" href="https://t.me/CheckGiftsPortalsBot" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 4.2c.3-1.2-.5-1.7-1.5-1.3L2.3 9.8c-1.2.5-1.2 1.2-.2 1.5l4.6 1.4 1.8 5.6c.2.6.1.8.7.8.5 0 .7-.2.9-.4l2.2-2.2 4.6 3.4c.8.5 1.4.3 1.6-.7L21.8 4.2ZM8.2 12.4l9-5.7c.4-.3.8-.1.5.2l-7.5 6.8-.3 3.4-1.7-4.7Z"/></svg>
        <span>Connect</span>
      </a>
    </section>
  </main>
</body>
</html>
